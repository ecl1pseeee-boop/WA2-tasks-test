# Boardy — доска объявлений. Локальный запуск: docker compose up -d
services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./services/php:/var/www/html:ro
    depends_on:
      - php
      - api

  php:
    build: ./services/php
    restart: unless-stopped
    volumes:
      - ./services/php:/var/www/html
    environment:
      APP_ENV: local
      DB_HOST: mysql
      DB_DATABASE: boardy
      DB_USERNAME: boardy
      DB_PASSWORD: boardy
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build: ./services/api
    restart: unless-stopped
    volumes:
      - ./services/api:/app
    environment:
      DB_HOST: mysql
      DB_NAME: boardy
      DB_USER: boardy
      DB_PASSWORD: boardy
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: boardy
      MYSQL_USER: boardy
      MYSQL_PASSWORD: boardy
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      retries: 10
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  mysql-data:
